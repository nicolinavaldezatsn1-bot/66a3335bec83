      - run:
          name: Subscribe to nodes
          command: LIONSS_LP=1 ./build/opcua_subscribe --conf opc.cfg --interval 500
  hashAgg:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
