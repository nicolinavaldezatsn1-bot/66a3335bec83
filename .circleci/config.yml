      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed groups
          command: |
            printf 'k,v\na,1\nb,2\n' > agg.csv
      - run:
          name: Build aggregator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hashAgg -j2
      - run:
          name: Hash-aggregate groups
          command: LIONSS_LP=1 ./build/hashAgg --in agg.csv --by k
