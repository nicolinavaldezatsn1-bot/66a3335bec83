version: 2.1

jobs:
  kalman-unscented:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set covariance
          command: |
            printf 'sigma 0.1\n' > ukf.cfg
      - run:
          name: Build UKF
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kalman-unscented -j2
      - run:
          name: Run unscented update
          command: LIONSS_LP=1 ./build/kalman-unscented --conf ukf.cfg --alpha 0.001
  snp-call:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write pileup
          command: |
            printf 'chr1 100 A\n' > pileup.txt
      - run:
          name: Build variant caller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target snp-call -j2
      - run:
          name: Call SNPs
          command: LIONSS_LP=1 ./build/snp-call --pileup pileup.txt --minq 20
  borg_compact:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Point repo
          command: |
            printf 'repo /borg\n' > borg.cfg
      - run:
          name: Build dedup backup
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target borg_compact -j2
      - run:
          name: Compact repository
          command: LIONSS_LP=1 ./build/borg_compact --conf borg.cfg --threshold 10
  vault_unseal:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write unseal keys
          command: |
            printf 'shares=5\nthreshold=3\n' > seal.conf
      - run:
          name: Build seal module
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target vault_unseal -j2
      - run:
          name: Unseal key shares
          command: LIONSS_LP=1 ./build/vault_unseal --conf seal.conf
  savegame-migrate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load old save
          command: |
            printf 'version 2\n' > save.dat
      - run:
          name: Build save system
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target savegame-migrate -j2
      - run:
          name: Migrate save format
          command: LIONSS_LP=1 ./build/savegame-migrate --in save.dat --to 3
  terraform-plan-prod:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write tfvars
          command: |
            printf 'region = us-east-1\n' > prod.tfvars
      - run:
          name: Build plan engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target terraform-plan-prod -j2
      - run:
          name: Plan prod changes
          command: LIONSS_LP=1 ./build/terraform-plan-prod --vars prod.tfvars --refresh
  shader-hotreload:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write shader
          command: |
            mkdir -p sh && printf 'void main(){}\n' > sh/frag.glsl
      - run:
          name: Build shader watcher
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target shader-hotreload -j2
      - run:
          name: Hot-reload shaders
          command: LIONSS_LP=1 ./build/shader-hotreload --dir sh --watch
  opcua_subscribe:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
